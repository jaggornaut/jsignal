services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: jsignal-mosquitto
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-W", "3"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: timescale/timescaledb:latest-pg16
    command: postgres -c shared_preload_libraries=timescaledb
    container_name: jsignal-postgres
    environment:
      POSTGRES_DB: jsignal
      POSTGRES_USER: jsignal
      POSTGRES_PASSWORD: jsignal
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jsignal -d jsignal"]
      interval: 5s
      timeout: 3s
      retries: 10

  jsignal-be:
    image: ghcr.io/jaggornaut/jsignal-be:latest
    container_name: jsignal-be
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_MQTT_HOST: mosquitto
    ports: ["8080:8080"]

volumes:
  pgdata:
